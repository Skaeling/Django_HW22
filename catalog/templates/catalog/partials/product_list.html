<!-- catalog/templates/catalog/partials/product_list.html -->
{% if product_list %}
<h5 class="text-center bg-primary-subtle text-dark rounded p-2">Выберите интересующий продукт</h5>
{% endif %}
{% for product in product_list %}
  <div class="accordion-item">
    <h2 class="accordion-header">
      <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse{{ product.id }}" aria-expanded="false" aria-controls="collapse{{ product.id }}">
        {{ product.name }}
      </button>
    </h2>
    <div id="collapse{{ product.id }}" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
      <div class="accordion-body">
        {{ product.description }}
        <a href="{% url 'catalog:product_detail' product.pk %}">Подробнее</a>
      </div>
    </div>
  </div>
{% empty %}
<h5 class="text-center bg-primary-subtle text-dark rounded p-2">Не выбран раздел или нет доступных продуктов</h5>
{% endfor %}
