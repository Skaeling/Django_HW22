<nav aria-label="Page navigation">
    <ul class="pagination justify-content-center">

        {% if page_obj.has_previous %}
        <li class="page-item">
            <a class="page-link border-info text-info" href="?page={{ page_obj.previous_page_number }}" aria-label="Previous">
            <span aria-hidden="true">&laquo;</span>
            </a>
        </li>
            {% else %}
            <li class="page-item disabled">
            <a class="page-link border-info text-info" href="#" aria-label="Previous">
            <span aria-hidden="true">&laquo;</span>
            </a>
        </li>
        {% endif %}

        {% for p in page_obj.paginator.page_range %}
            {% if page_obj.number == p %}
            <li class="page-item active"><a class="page-link border-info bg-info-subtle text-dark" href="#">{{ p }}</a></li>
            {% else %}
            <li class="page-item"><a class="page-link border-info text-info" href="?page={{ p }}">{{ p }}</a></li>
            {% endif %}
        {% endfor %}

        {% if page_obj.has_next %}
            <li class="page-item">
                <a class="page-link border-info text-info" href="?page={{ page_obj.next_page_number }}" aria-label="Next">
                <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        {% else %}
            <li class="page-item disabled">
                <a class="page-link border-info text-info" href="#" aria-label="Next">
                <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        {% endif %}

    </ul>
</nav>
