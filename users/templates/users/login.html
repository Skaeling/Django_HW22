{% extends 'catalog/base.html' %}
{% block title%}{{ title }}{% endblock %}
{% block content%}
    <!--    Основная колонка -->
        <div class="col-12">
            {% include "catalog/includes/inc_catalog_header.html" with title='Вход в личный кабинет' only%}

            <div class="row mt-3">
                <div class="container d-flex justify-content-center">
                            <!-- Форма входа-->
                            <form method="post" action="" class="form-floating">
                                {% csrf_token %}
                                {{ form.as_p }}
                                <div class="col-12 mt-5 text-center">
                                    <a href="{% url 'catalog:home' %}" class="btn btn-info">Назад</a>
                                    <button type="submit" class="btn btn-info">Войти</button>
                                </div>
                            </form>

                </div>
            </div>

        </div>
{% endblock %}
