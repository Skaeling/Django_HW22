{% extends 'catalog/base.html' %}
{% block content%}
<div class="col-12 text-center">
    <h1 class="display-5">{{ post.title }}</h1>
    <div class="row text-secondary text-center">
        <h6>Опубликовано: {{ post.created_at }}</h6>
    </div>

    <div class="row mt-3">
        <div class="row row-cols-2">
            <div class="col">
                <div class="container" style="height: 75vh">
                    <div class="row h-100">
                <div class="col-12 h-100 overflow-auto">
                <p class="text-start">
                    {{ post.body|safe }}</p>
                </div>
                </div>
                </div>
                <p class="text-end text-secondary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                             class="bi bi-eye" viewBox="0 0 16 16">
                            <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
                            <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
                        </svg>
                        {{ post.views_count }}
                </p>
                <div class="container mt-1">
                    <a href="{% url 'blog:posts_list' %}" class="btn btn-info">К оглавлению</a>
                    <a href="{% url 'blog:post_update' post.pk %}" class="btn btn-info">Редактировать</a>
                    <a href="{% url 'blog:post_delete' post.pk %}" class="btn btn-warning">Удалить</a>
                </div>
            </div>
            <div class="col">
                <img src="{{ post.preview.url }}" alt="image" height="300" width="600">
            </div>
        </div>
    </div>
</div>
{% endblock %}
